<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery — CodeAlpha Task 1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #1a1a1a;
    --card: #222222;
    --border: #333;
    --accent: #c9a84c;
    --accent2: #e8c97a;
    --text: #f0ece3;
    --muted: #888;
    --white: #fff;
    --overlay: rgba(0,0,0,0.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 3rem 2rem 2rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  header h1 span { color: var(--accent); }
  header p {
    margin-top: 0.5rem;
    color: var(--muted);
    font-size: 1rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* FILTER TABS */
  .filters {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.4rem 1.2rem;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.2s ease;
  }
  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 500;
  }

  /* GALLERY GRID */
  .gallery-container { padding: 2rem; max-width: 1400px; margin: 0 auto; }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
  }

  .gallery-item {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    background: var(--card);
    border: 1px solid var(--border);
    aspect-ratio: 4/3;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .gallery-item:nth-child(3n+2) { aspect-ratio: 4/5; }
  .gallery-item:nth-child(5n+1) { aspect-ratio: 16/9; }

  .gallery-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(201,168,76,0.15);
    border-color: var(--accent);
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease, filter 0.3s ease;
  }
  .gallery-item:hover img {
    transform: scale(1.06);
    filter: brightness(0.75);
  }

  /* HOVER OVERLAY */
  .item-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1.25rem;
  }
  .gallery-item:hover .item-overlay { opacity: 1; }
  .item-overlay h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: #fff;
    margin-bottom: 0.25rem;
  }
  .item-overlay p {
    font-size: 0.78rem;
    color: var(--accent2);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .item-overlay .icon {
    position: absolute;
    top: 1rem; right: 1rem;
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(4px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  /* CATEGORY BADGE */
  .category-badge {
    position: absolute;
    top: 0.75rem; left: 0.75rem;
    background: rgba(0,0,0,0.6);
    color: var(--accent);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    border: 1px solid var(--accent);
    backdrop-filter: blur(4px);
  }

  /* LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 1000;
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 2rem;
    animation: fadeIn 0.25s ease;
  }
  .lightbox.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .lightbox-inner {
    position: relative;
    max-width: 900px;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    border: 1px solid var(--border);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .lightbox-inner img {
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    background: #111;
    display: block;
  }
  .lightbox-caption {
    background: var(--surface);
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
  }
  .lightbox-caption h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
  }
  .lightbox-caption span {
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* NAVIGATION */
  .lb-controls {
    display: flex;
    gap: 1rem;
    margin-top: 1.25rem;
    align-items: center;
  }
  .lb-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 1.8rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .lb-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
  .lb-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .lb-btn:disabled:hover { background: var(--surface); color: var(--text); border-color: var(--border); }
  .lb-counter {
    color: var(--muted);
    font-size: 0.85rem;
    min-width: 60px;
    text-align: center;
  }
  .close-btn {
    position: fixed;
    top: 1.5rem; right: 1.5rem;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--border);
    color: var(--text);
    width: 42px; height: 42px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    z-index: 1001;
  }
  .close-btn:hover { background: #c0392b; border-color: #c0392b; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .gallery-container { padding: 1rem; }
    header { padding: 2rem 1rem 1.5rem; }
    .gallery-item, .gallery-item:nth-child(3n+2), .gallery-item:nth-child(5n+1) { aspect-ratio: 1; }
  }
  @media (max-width: 400px) {
    .gallery-grid { grid-template-columns: 1fr; }
  }

  /* HIDDEN */
  .gallery-item.hidden { display: none; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<header>
  <h1>Photo <span>Gallery</span></h1>
  <p>CodeAlpha Internship — Task 1</p>
</header>

<div class="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="nature">Nature</button>
  <button class="filter-btn" data-filter="architecture">Architecture</button>
  <button class="filter-btn" data-filter="travel">Travel</button>
  <button class="filter-btn" data-filter="abstract">Abstract</button>
</div>

<div class="gallery-container">
  <div class="gallery-grid" id="gallery">
    <!-- Items injected by JS -->
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="close-btn" id="closeBtn">✕</button>
  <div class="lightbox-inner">
    <img id="lbImg" src="" alt="">
    <div class="lightbox-caption">
      <h3 id="lbTitle">Image Title</h3>
      <span id="lbCat">Category</span>
    </div>
  </div>
  <div class="lb-controls">
    <button class="lb-btn" id="prevBtn">← Prev</button>
    <span class="lb-counter" id="lbCounter">1 / 12</span>
    <button class="lb-btn" id="nextBtn">Next →</button>
  </div>
</div>

<footer>Built with HTML, CSS &amp; JavaScript &mdash; CodeAlpha Frontend Internship</footer>

<script>
const images = [
  { title: "Forest Dawn",      category: "nature",       url: "https://picsum.photos/seed/forest/800/600",      color: "#1a2e1a" },
  { title: "City Skyline",     category: "architecture", url: "https://picsum.photos/seed/city/800/600",        color: "#1a1a2e" },
  { title: "Mountain Lake",    category: "travel",       url: "https://picsum.photos/seed/mountain/800/600",    color: "#1a2a2e" },
  { title: "Geometric Forms",  category: "abstract",     url: "https://picsum.photos/seed/abstract1/800/600",   color: "#2e1a2a" },
  { title: "Ocean Waves",      category: "nature",       url: "https://picsum.photos/seed/ocean/800/600",       color: "#1a1e2e" },
  { title: "Glass Tower",      category: "architecture", url: "https://picsum.photos/seed/tower/800/600",       color: "#2e2e1a" },
  { title: "Tokyo Streets",    category: "travel",       url: "https://picsum.photos/seed/tokyo/800/600",       color: "#2e1a1a" },
  { title: "Color Burst",      category: "abstract",     url: "https://picsum.photos/seed/colors/800/600",      color: "#1a2e2e" },
  { title: "Autumn Path",      category: "nature",       url: "https://picsum.photos/seed/autumn/800/600",      color: "#2e2a1a" },
  { title: "Bridge at Night",  category: "architecture", url: "https://picsum.photos/seed/bridge/800/600",      color: "#1a1e2e" },
  { title: "Santorini",        category: "travel",       url: "https://picsum.photos/seed/santorini/800/600",   color: "#1a2030" },
  { title: "Fluid Art",        category: "abstract",     url: "https://picsum.photos/seed/fluid/800/600",       color: "#2a1a2e" },
];

let currentIndex = 0;
let filtered = [...images];

function buildGallery(items) {
  const grid = document.getElementById('gallery');
  grid.innerHTML = '';
  items.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.dataset.index = i;
    div.innerHTML = `
      <img src="${img.url}" alt="${img.title}" loading="lazy">
      <span class="category-badge">${img.category}</span>
      <div class="item-overlay">
        <span class="icon">🔍</span>
        <h3>${img.title}</h3>
        <p>${img.category}</p>
      </div>
    `;
    div.addEventListener('click', () => openLightbox(i));
    grid.appendChild(div);
  });
}

function openLightbox(index) {
  currentIndex = index;
  updateLightbox();
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function updateLightbox() {
  const img = filtered[currentIndex];
  document.getElementById('lbImg').src = img.url;
  document.getElementById('lbTitle').textContent = img.title;
  document.getElementById('lbCat').textContent = img.category;
  document.getElementById('lbCounter').textContent = `${currentIndex + 1} / ${filtered.length}`;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === filtered.length - 1;
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentIndex > 0) { currentIndex--; updateLightbox(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentIndex < filtered.length - 1) { currentIndex++; updateLightbox(); }
});
document.getElementById('closeBtn').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.filter;
    filtered = cat === 'all' ? [...images] : images.filter(i => i.category === cat);
    buildGallery(filtered);
  });
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateLightbox(); }
  if (e.key === 'ArrowRight' && currentIndex < filtered.length - 1) { currentIndex++; updateLightbox(); }
});

buildGallery(images);
</script>
</body>
</html>
